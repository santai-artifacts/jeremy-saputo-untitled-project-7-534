<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Worm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --grid-a: #12161d;
    --grid-b: #10141a;
    --border: #232a34;
    --accent: #ff3ea5;
    --accent-dim: #c21e78;
    --food: #ffd23f;
    --text: #e6edf3;
    --muted: #7d8590;
    --radius: 16px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
  }

  body {
    background: radial-gradient(1200px 800px at 50% -10%, #241426 0%, var(--bg) 55%);
    color: var(--text);
    font-family: 'Space Grotesk', system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100dvh;
    padding: 20px;
    -webkit-font-smoothing: antialiased;
  }

  .app {
    width: 100%;
    max-width: 460px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 12px;
  }

  .title {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .logo {
    width: 40px; height: 40px;
    border-radius: 12px;
    background: linear-gradient(145deg, var(--accent), var(--accent-dim));
    display: grid;
    place-items: center;
    box-shadow: 0 6px 18px -6px var(--accent-dim);
  }
  .logo svg { width: 24px; height: 24px; display: block; }

  h1 {
    font-size: 1.6rem;
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  .scores {
    display: flex;
    gap: 10px;
  }

  .stat {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 8px 14px;
    text-align: center;
    min-width: 68px;
  }
  .stat .label {
    font-size: 0.62rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--muted);
  }
  .stat .value {
    font-size: 1.25rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    line-height: 1.2;
  }

  .board-wrap {
    position: relative;
    border-radius: var(--radius);
    padding: 12px;
    background: var(--panel);
    border: 1px solid var(--border);
    box-shadow: 0 24px 60px -30px rgba(0,0,0,0.8);
  }

  canvas {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 10px;
    touch-action: none;
    image-rendering: pixelated;
  }

  .overlay {
    position: absolute;
    inset: 12px;
    border-radius: 10px;
    background: rgba(10, 14, 20, 0.82);
    backdrop-filter: blur(4px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    text-align: center;
    padding: 24px;
    transition: opacity 0.25s ease;
  }
  .overlay.hidden { opacity: 0; pointer-events: none; }

  .overlay h2 {
    font-size: 1.7rem;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  .overlay p {
    color: var(--muted);
    font-size: 0.95rem;
    max-width: 260px;
    line-height: 1.5;
  }
  .overlay .final { color: var(--accent); font-weight: 700; }

  button.play {
    font-family: inherit;
    font-size: 1rem;
    font-weight: 600;
    color: #2a0518;
    background: linear-gradient(145deg, var(--accent), var(--accent-dim));
    border: none;
    padding: 12px 28px;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 10px 24px -10px var(--accent-dim);
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  button.play:hover { transform: translateY(-2px); box-shadow: 0 14px 28px -10px var(--accent-dim); }
  button.play:active { transform: translateY(0); }

  .footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }

  .hint {
    color: var(--muted);
    font-size: 0.82rem;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  kbd {
    font-family: inherit;
    background: var(--panel);
    border: 1px solid var(--border);
    border-bottom-width: 2px;
    border-radius: 6px;
    padding: 1px 7px;
    font-size: 0.72rem;
    color: var(--text);
  }

  .speed-toggle {
    display: flex;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 3px;
    gap: 2px;
  }
  .speed-toggle button {
    font-family: inherit;
    font-size: 0.75rem;
    font-weight: 500;
    color: var(--muted);
    background: transparent;
    border: none;
    padding: 6px 12px;
    border-radius: 999px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .speed-toggle button.active {
    background: var(--accent);
    color: #2a0518;
    font-weight: 600;
  }

  @media (max-width: 400px) {
    h1 { font-size: 1.35rem; }
    .stat { min-width: 58px; padding: 7px 10px; }
  }

  @media (prefers-reduced-motion: reduce) {
    button.play, .overlay { transition: none; }
  }
</style>
</head>
<body>
  <div class="app">
    <header>
      <div class="title">
        <span class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="#2a0518" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 8h8a3 3 0 0 1 0 6H6a3 3 0 0 0 0 6h10"/>
            <circle cx="19" cy="7" r="1.4" fill="#2a0518" stroke="none"/>
          </svg>
        </span>
        <h1>Worm</h1>
      </div>
      <div class="scores">
        <div class="stat">
          <div class="label">Score</div>
          <div class="value" id="score">0</div>
        </div>
        <div class="stat">
          <div class="label">Best</div>
          <div class="value" id="best">0</div>
        </div>
      </div>
    </header>

    <div class="board-wrap">
      <canvas id="game" width="440" height="440"></canvas>
      <div class="overlay" id="overlay">
        <h2 id="ov-title">Worm</h2>
        <p id="ov-text">Eat the apples, grow as long as you can, and don't bite your own tail. Use the arrow keys, WASD, or swipe to steer.</p>
        <button class="play" id="playBtn">Play</button>
      </div>
    </div>

    <div class="footer">
      <div class="hint">
        <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd>
        <span>or swipe · <kbd>Space</kbd> to pause</span>
      </div>
      <div class="speed-toggle" id="speed" role="group" aria-label="Speed">
        <button data-speed="140">Chill</button>
        <button data-speed="95" class="active">Normal</button>
        <button data-speed="60">Fast</button>
      </div>
    </div>
  </div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const ovTitle = document.getElementById('ov-title');
  const ovText = document.getElementById('ov-text');
  const playBtn = document.getElementById('playBtn');
  const speedGroup = document.getElementById('speed');

  const GRID = 20;                 // cells per side
  const CELL = canvas.width / GRID; // px per cell (22)

  let snake, dir, nextDir, food, score, best = 0, tickMs = 95;
  let state = 'idle'; // idle | running | paused | over
  let acc = 0, lastTime = 0, rafId = null;
  let foodPulse = 0;

  function reset() {
    const c = Math.floor(GRID / 2);
    snake = [ {x: c-1, y: c}, {x: c-2, y: c}, {x: c-3, y: c} ];
    dir = {x: 1, y: 0};
    nextDir = {x: 1, y: 0};
    score = 0;
    scoreEl.textContent = '0';
    placeFood();
    foodPulse = 0;
  }

  function placeFood() {
    let p;
    do {
      p = { x: (Math.random() * GRID) | 0, y: (Math.random() * GRID) | 0 };
    } while (snake.some(s => s.x === p.x && s.y === p.y));
    food = p;
  }

  function start() {
    reset();
    state = 'running';
    overlay.classList.add('hidden');
    acc = 0;
    lastTime = performance.now();
    if (!rafId) rafId = requestAnimationFrame(loop);
  }

  function gameOver() {
    state = 'over';
    if (score > best) { best = score; bestEl.textContent = best; }
    ovTitle.textContent = 'Game Over';
    ovText.innerHTML = `You scored <span class="final">${score}</span> point${score === 1 ? '' : 's'}.` +
      (score >= best && score > 0 ? ' A new best!' : '');
    playBtn.textContent = 'Play Again';
    overlay.classList.remove('hidden');
  }

  function step() {
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    // wall or self collision
    if (head.x < 0 || head.y < 0 || head.x >= GRID || head.y >= GRID ||
        snake.some(s => s.x === head.x && s.y === head.y)) {
      gameOver();
      return;
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score++;
      scoreEl.textContent = score;
      if (score > best) { best = score; bestEl.textContent = best; }
      placeFood();
      foodPulse = 1;
    } else {
      snake.pop();
    }
  }

  // ---- Rendering ----
  function drawGrid() {
    for (let y = 0; y < GRID; y++) {
      for (let x = 0; x < GRID; x++) {
        ctx.fillStyle = (x + y) % 2 === 0 ? '#12161d' : '#10141a';
        ctx.fillRect(x * CELL, y * CELL, CELL, CELL);
      }
    }
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, r);
    ctx.fill();
  }

  function draw() {
    drawGrid();

    // food
    foodPulse = Math.max(0, foodPulse - 0.05);
    const fx = food.x * CELL, fy = food.y * CELL;
    const pad = 3 + foodPulse * 1.5;
    ctx.fillStyle = '#ffd23f';
    ctx.shadowColor = 'rgba(255,210,63,0.7)';
    ctx.shadowBlur = 12;
    roundRect(fx + pad, fy + pad, CELL - pad * 2, CELL - pad * 2, 5);
    ctx.shadowBlur = 0;
    // leaf
    ctx.fillStyle = '#22e06b';
    roundRect(fx + CELL * 0.55, fy + pad - 1, CELL * 0.22, CELL * 0.22, 2);

    // snake — hot pink, bright head fading toward a deeper pink tail
    const len = snake.length;
    for (let i = len - 1; i >= 0; i--) {
      const s = snake[i];
      const t = i / len;
      const r = Math.round(255 - t * 30);   // 255 -> 225
      const g = Math.round(62  - t * 40);   // 62  -> 22
      const b = Math.round(165 - t * 45);   // 165 -> 120
      ctx.fillStyle = i === 0 ? '#ff6ec7' : `rgb(${r}, ${g}, ${b})`;
      const inset = i === 0 ? 1.5 : 2.5;
      roundRect(s.x * CELL + inset, s.y * CELL + inset, CELL - inset * 2, CELL - inset * 2, i === 0 ? 6 : 5);
    }

    // eyes on head
    const head = snake[0];
    ctx.fillStyle = '#2a0518';
    const hx = head.x * CELL, hy = head.y * CELL;
    const ex = dir.x, ey = dir.y;
    const cx = hx + CELL / 2, cy = hy + CELL / 2;
    const off = CELL * 0.2;
    const perp = { x: -ey, y: ex };
    const eyeR = CELL * 0.09;
    [1, -1].forEach(sgn => {
      const px = cx + ex * off + perp.x * off * sgn;
      const py = cy + ey * off + perp.y * off * sgn;
      ctx.beginPath();
      ctx.arc(px, py, eyeR, 0, Math.PI * 2);
      ctx.fill();
    });
  }

  function loop(now) {
    rafId = requestAnimationFrame(loop);
    const dt = now - lastTime;
    lastTime = now;

    if (state === 'running') {
      acc += dt;
      while (acc >= tickMs) {
        acc -= tickMs;
        step();
        if (state !== 'running') break;
      }
    }
    draw();
  }

  // ---- Input ----
  function turn(nx, ny) {
    // prevent reversing directly into the neck
    if (nx === -dir.x && ny === -dir.y) return;
    // avoid double-turn within one tick
    if (nx === dir.x && ny === dir.y) return;
    nextDir = { x: nx, y: ny };
  }

  const keyMap = {
    ArrowUp: [0,-1], ArrowDown: [0,1], ArrowLeft: [-1,0], ArrowRight: [1,0],
    w: [0,-1], s: [0,1], a: [-1,0], d: [1,0],
    W: [0,-1], S: [0,1], A: [-1,0], D: [1,0]
  };

  window.addEventListener('keydown', (e) => {
    if (e.key === ' ') {
      e.preventDefault();
      togglePause();
      return;
    }
    if (e.key === 'Enter' && (state === 'idle' || state === 'over')) {
      start();
      return;
    }
    const m = keyMap[e.key];
    if (m) {
      e.preventDefault();
      if (state === 'running') turn(m[0], m[1]);
    }
  });

  function togglePause() {
    if (state === 'running') {
      state = 'paused';
      ovTitle.textContent = 'Paused';
      ovText.textContent = 'Take a breath. Press Space or Play to resume.';
      playBtn.textContent = 'Resume';
      overlay.classList.remove('hidden');
    } else if (state === 'paused') {
      state = 'running';
      overlay.classList.add('hidden');
      lastTime = performance.now();
    }
  }

  playBtn.addEventListener('click', () => {
    if (state === 'paused') { togglePause(); }
    else { start(); }
  });

  // touch / swipe
  let touchStart = null;
  canvas.addEventListener('touchstart', (e) => {
    touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }, { passive: true });
  canvas.addEventListener('touchmove', (e) => {
    if (!touchStart || state !== 'running') return;
    const dx = e.touches[0].clientX - touchStart.x;
    const dy = e.touches[0].clientY - touchStart.y;
    if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
    if (Math.abs(dx) > Math.abs(dy)) turn(dx > 0 ? 1 : -1, 0);
    else turn(0, dy > 0 ? 1 : -1);
    touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    e.preventDefault();
  }, { passive: false });

  // speed toggle
  speedGroup.addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    tickMs = Number(btn.dataset.speed);
    [...speedGroup.children].forEach(b => b.classList.toggle('active', b === btn));
  });

  // boot: draw initial frame behind overlay
  reset();
  rafId = requestAnimationFrame(loop);
})();
</script>
</body>
</html>
